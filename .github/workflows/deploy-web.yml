# Deploys the web app (frontend/) to Vercel on every push to main, whoever made the commit.
#
# Vercel's Hobby plan only builds git pushes from the project owner, so teammates' commits
# were "blocked". This runs the Vercel CLI with the owner's token instead, so every push
# deploys. Vercel's own git trigger is off (frontend/vercel.json) to avoid double deploys.
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       - from vercel.com/account/tokens
#   VERCEL_ORG_ID      - "orgId" in .vercel/project.json after `vercel link`
#   VERCEL_PROJECT_ID  - "projectId" in the same file
name: Deploy web to Vercel

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Vercel CLI
        run: npm install --global vercel@48.10.2
      - name: Pull production settings and env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      # The CLI sends the commit's author along with the deploy, and Hobby blocks deploys of
      # commits by anyone but the owner (the deploy sits at BLOCKED and the CLI waits forever).
      # Without .git there's no author to check; the deploy is still made with the owner's token.
      - name: Drop git metadata
        run: rm -rf .git
      # Vercel builds it on its own servers (local `vercel build` rejects the project's Node 24).
      - name: Deploy
        timeout-minutes: 10
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
